[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ragkit"
version = "0.1.0"
description = "Production-ready RAG library using Chroma and OpenAI"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [
    {name = "RAGKit Team"}
]
keywords = ["rag", "retrieval", "embeddings", "chroma", "openai", "vector-database"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]

dependencies = [
    "chromadb>=0.5.10,<0.6",
    "openai>=1.30,<2",
    "python-dotenv>=1.0,<2",
    "pypdf>=4.2,<5",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0,<9",
    "pytest-cov>=4.0,<5",
    "ruff>=0.3,<0.4",
]

[tool.setuptools.packages.find]
include = ["ragkit*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "live: tests that require OpenAI API key (deselect with '-m \"not live\"')",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP"]
ignore = ["E501"]
