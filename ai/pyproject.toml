[project]
name = "livenote-ai"
version = "0.1.0"
description = "LiveNote AI 서버 (요약, QnA, 자료 추천, RAG)"
requires-python = "==3.11.*"
dependencies = [
    # 서버
    "fastapi==0.115.0",
    "uvicorn[standard]==0.30.6",
    "python-multipart==0.0.9",
    "pydantic==2.9.0",
    "python-dotenv==1.0.1",
    # HTTP (OpenAlex 클라이언트가 HTTP/2 사용)
    "httpx[http2]==0.27.2",
    # OpenAI, LangChain·LangGraph, 벡터 DB, PDF
    "openai==3.41.0",
    "langchain-core==1.7.1",
    "langchain-openai==1.7.3",
    "langchain-text-splitters==1.1.3",
    "langchain-chroma==1.1.0",
    "langgraph==1.2.15",
    "chromadb==1.5.9",
    "pypdf==4.2.0",
    # 강의 자료 분할 (토큰 계산, semantic 분할 거리 계산)
    "tiktoken==0.14.0",
    "numpy==2.4.6",
    # 영상 추천
    "youtube-transcript-api==0.6.1",
    "rapidfuzz==3.6.1",
]

[dependency-groups]
dev = [
    "pytest==9.1.1",
    # eval/collect_sections.py (녹음 WebSocket 전송), eval/run_cards.py
    "aiohttp==3.14.3",
    # eval/prepare_data.py (강의 자료 Markdown → PDF)
    "markdown==3.11.2",
]

[tool.uv]
# 설치 가능한 패키지가 아니라 ai/ 폴더에서 바로 실행하는 서버이므로 의존성만 관리
package = false

[tool.pytest.ini_options]
anyio_backend = "asyncio"
testpaths = ["tests"]
