spring:
  config:
    import: "optional:classpath:env.properties"

  datasource:
    url: ${SPRING_DATASOURCE_URL}
    username: ${SPRING_DATASOURCE_USERNAME}
    password: ${SPRING_DATASOURCE_PASSWORD}

  jpa:
    hibernate:
      # 스키마는 Flyway 마이그레이션(db/migration)으로만 변경하고, 엔티티와 일치하는지만 검사
      ddl-auto: validate

  servlet:
    multipart:
      max-file-size: 50MB      # 파일 하나당 최대 크기
      max-request-size: 50MB   # 요청 전체 최대 크기
#  main:
#    allow-circular-references: true
ai:
  server:
    url: ${AI_SERVER_URL}


openai:
  api:
    key: ${OPENAI_API_KEY}
app:
  storage:
    audio-dir: uploads/audio

  openai:
    api:
      key: ${OPENAI_API_KEY}
    stt:
      model: ${APP_OPENAI_STT_MODEL:whisper-1}
    realtime:
      transcription-model: ${APP_OPENAI_REALTIME_TRANSCRIPTION_MODEL:gpt-4o-transcribe}
    summary:
      model: gpt-4o-mini
      max-tokens: 500

  jwt:
    secret: ${APP_JWT_SECRET}
    expiration: 3600000


  logging:
    level:
      i.n.r.d.DnsServerAddressStreamProviders: WARN

  callback-base-url: ${APP_CALLBACK_BASE_URL:http://localhost:8080}

  ai:
    base-url: ${AI_SERVER_URL}
    history:
      previous-summary-count: 3
      previous-resource-sections: 3
      previous-qa-sections: 3

  transcription:
    padding-seconds: ${APP_TRANSCRIPTION_PADDING_SECONDS:2.0}
    speed-multiplier: ${APP_TRANSCRIPTION_SPEED_MULTIPLIER:1.2}

  streaming:
    chunk-size: ${APP_STREAMING_CHUNK_SIZE:10}
    delay-ms: ${APP_STREAMING_DELAY_MS:100}
