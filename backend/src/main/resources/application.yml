spring:
  config:
    import: "optional:classpath:env.properties"

  datasource:
    url: ${SPRING_DATASOURCE_URL}
    username: ${SPRING_DATASOURCE_USERNAME}
    password: ${SPRING_DATASOURCE_PASSWORD}

  jpa:
    hibernate:
      # 스키마는 Flyway 마이그레이션(db/migration)으로만 변경하고, 엔티티와 일치하는지만 검사
      ddl-auto: validate

  # 서버 여러 대가 공유하는 녹음 상태와 잠금 저장소
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}

  servlet:
    multipart:
      max-file-size: 50MB      # 파일 하나당 최대 크기
      max-request-size: 50MB   # 요청 전체 최대 크기
#  main:
#    allow-circular-references: true
ai:
  server:
    url: ${AI_SERVER_URL}


openai:
  api:
    key: ${OPENAI_API_KEY}
app:
  openai:
    api:
      key: ${OPENAI_API_KEY}
    realtime:
      transcription-model: ${APP_OPENAI_REALTIME_TRANSCRIPTION_MODEL:gpt-transcribe}

  jwt:
    secret: ${APP_JWT_SECRET}
    # 접근 토큰 유효 시간(ms). 만료되면 프론트엔드가 갱신 토큰으로 새로 받음
    expiration: ${APP_JWT_EXPIRATION_MS:1800000}
    refresh-expiration-days: ${APP_JWT_REFRESH_EXPIRATION_DAYS:14}
    # 갱신 토큰 쿠키에 Secure 속성을 붙일지 여부. HTTPS가 아닌 주소에서 쿠키가 저장되지 않으면 false로 설정
    refresh-cookie-secure: ${APP_JWT_REFRESH_COOKIE_SECURE:true}


  logging:
    level:
      i.n.r.d.DnsServerAddressStreamProviders: WARN

  callback-base-url: ${APP_CALLBACK_BASE_URL:http://localhost:8080}

  # STOMP 메시지를 중계하는 RabbitMQ (rabbitmq_stomp 플러그인)
  stomp-relay:
    host: ${RABBITMQ_STOMP_HOST:localhost}
    port: ${RABBITMQ_STOMP_PORT:61613}
    login: ${RABBITMQ_USERNAME}
    passcode: ${RABBITMQ_PASSWORD}
    virtual-host: ${RABBITMQ_VHOST:livenote}

  # AI 서버와 공유하는 내부 키. 백엔드→AI 요청과 AI→백엔드 콜백의 X-Internal-Api-Key 헤더로 사용
  internal-api-key: ${INTERNAL_API_KEY}

  ai:
    base-url: ${AI_SERVER_URL}
    history:
      previous-summary-count: 3
      previous-resource-sections: 3
      previous-qa-sections: 3
    # 부분 요약 시 QnA 2개·자료 2종 자동 생성. 전사·요약만 필요한 평가 데이터 수집 때 false
    auto-cards:
      enabled: ${APP_AI_AUTO_CARDS_ENABLED:true}

